name: AWS production readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-private-postgres-runner-development
  cancel-in-progress: false

jobs:
  readiness:
    name: Drill load, recovery, and abuse bounds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: development
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.19.0"
          package-manager-cache: false

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Build exact source
        run: npm run build

      - name: Generate security, performance, SBOM, and provenance Evidence
        run: |
          mkdir -p .release/readiness/reports
          node tooling/conformance/run-security-gates.mjs \
            --out .release/readiness/reports/security.json
          node tooling/conformance/benchmark.mjs \
            --out .release/readiness/reports/performance.json
          node tooling/release/prepare-candidate.mjs \
            --package apps/cli \
            --out .release/readiness/candidate \
            --performance .release/readiness/reports/performance.json \
            --security .release/readiness/reports/security.json \
            --source-revision "${GITHUB_SHA}"
          node tooling/release/attest-tested-bytes.mjs \
            .release/readiness/candidate/release-candidate.json \
            .release/readiness/candidate/test-attestation.json \
            -- node tooling/release/verify-packed-artifact.mjs
          node tooling/release/check-candidate.mjs \
            .release/readiness/candidate/release-candidate.json

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: Exchange GitHub OIDC for bounded AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: production-readiness-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Initialize encrypted remote state
        working-directory: tooling/infra/aws/metadata-cloud
        run: |
          tofu init -input=false \
            -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}" \
            -backend-config="key=metadata-cloud/development.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="kms_key_id=${{ vars.AWS_STATE_KMS_KEY_ARN }}" \
            -backend-config="use_lockfile=true"

      - name: Validate production-readiness infrastructure
        working-directory: tooling/infra/aws/metadata-cloud
        run: tofu validate -no-color

      - name: Build immutable production-readiness plan
        working-directory: tooling/infra/aws/metadata-cloud
        run: |
          tofu plan -input=false -lock-timeout=5m -out=readiness.tfplan \
            -var='deployment_enabled=true' \
            -var='aws_account_id=${{ vars.AWS_ACCOUNT_ID }}' \
            -var='aws_region=${{ vars.AWS_REGION }}' \
            -var='environment=development' \
            -var='budget_alert_email=${{ vars.AWS_BUDGET_ALERT_EMAIL }}' \
            -var='monthly_budget_usd=100' \
            -var='readiness_runner_enabled=true' \
            -var='readiness_runner_image_tag=${{ github.sha }}'

      - name: Apply immutable production-readiness plan
        working-directory: tooling/infra/aws/metadata-cloud
        run: tofu apply -input=false -auto-approve readiness.tfplan

      - name: Read non-secret runner coordinates
        id: runner
        working-directory: tooling/infra/aws/metadata-cloud
        run: |
          echo "repository=$(tofu output -raw readiness_runner_repository_url)" >> "$GITHUB_OUTPUT"
          echo "task_definition=$(tofu output -raw readiness_runner_task_definition_arn)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(tofu output -raw readiness_runner_cluster_arn)" >> "$GITHUB_OUTPUT"
          echo "subnet=$(tofu output -raw readiness_runner_subnet_id)" >> "$GITHUB_OUTPUT"
          echo "security_group=$(tofu output -raw readiness_runner_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "log_group=$(tofu output -raw readiness_runner_log_group_name)" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable production-readiness image
        env:
          REPOSITORY: ${{ steps.runner.outputs.repository }}
        run: |
          registry="${REPOSITORY%%/*}"
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"
          docker build \
            --file tooling/infra/aws/metadata-cloud/readiness-runner.Dockerfile \
            --tag "$REPOSITORY:${{ github.sha }}" .
          docker push "$REPOSITORY:${{ github.sha }}"

      - name: Resolve the pushed immutable image digest
        env:
          REPOSITORY: ${{ steps.runner.outputs.repository }}
        run: |
          repository_name="${REPOSITORY#*/}"
          image_digest=$(aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-id imageTag="${{ github.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          [[ "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]

      - name: Run live production-readiness drill
        env:
          CLUSTER: ${{ steps.runner.outputs.cluster }}
          LOG_GROUP: ${{ steps.runner.outputs.log_group }}
          SECURITY_GROUP: ${{ steps.runner.outputs.security_group }}
          SUBNET: ${{ steps.runner.outputs.subnet }}
          TASK_DEFINITION: ${{ steps.runner.outputs.task_definition }}
        run: |
          task_arn=''
          exit_code='None'
          stopped_reason=''
          container_reason=''
          for launch_attempt in {1..3}; do
            task_arn=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$TASK_DEFINITION" \
              --launch-type FARGATE \
              --platform-version 1.4.0 \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBNET],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
              --query 'tasks[0].taskArn' \
              --output text)
            test "$task_arn" != "None"
            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
            task_description=$(aws ecs describe-tasks \
              --cluster "$CLUSTER" \
              --tasks "$task_arn" \
              --output json)
            exit_code=$(jq -r '.tasks[0].containers[0].exitCode // "None"' <<< "$task_description")
            stopped_reason=$(jq -r '.tasks[0].stoppedReason // "None"' <<< "$task_description")
            container_reason=$(jq -r '.tasks[0].containers[0].reason // "None"' <<< "$task_description")
            echo "task attempt=$launch_attempt exit=$exit_code stopped_reason=$stopped_reason container_reason=$container_reason"
            if [[ "$stopped_reason" != CannotPullContainerError:* ]]; then
              break
            fi
            if test "$launch_attempt" -lt 3; then
              echo "Private ECR pull was not ready; retrying the exact immutable task."
              sleep 15
            fi
          done
          task_id="${task_arn##*/}"
          log_stream="postgres/production-readiness/$task_id"
          log_messages='[]'
          for attempt in {1..30}; do
            if candidate=$(aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$log_stream" \
              --limit 100 \
              --query 'events[].message' \
              --output json 2>/dev/null); then
              log_messages="$candidate"
              if test "$(jq length <<< "$log_messages")" -gt 0; then
                break
              fi
            fi
            sleep 2
          done
          jq -r '.[]' <<< "$log_messages"
          evidence=$(jq -r \
            '[.[] | fromjson? | select(.kind == "awsProductionReadinessEvidence")] | last // empty | tojson' \
            <<< "$log_messages")
          test -n "$evidence"
          echo "$evidence" | jq -e '
            .schemaVersion == 1
            and .kind == "awsProductionReadinessEvidence"
            and .outcome == "passed"
            and ([.checks[]] | all(. == "passed"))'
          if jq -e --arg source "SOURCE_CANARY_M9_READINESS_${GITHUB_SHA:0:12}" \
            --arg secret "SECRET_CANARY_M9_READINESS_${GITHUB_SHA:0:12}" \
            '[.[] | contains($source) or contains($secret)] | any' \
            <<< "$log_messages" >/dev/null; then
            echo "A production-readiness canary reached CloudWatch logs."
            exit 1
          fi
          test "$exit_code" = "0"

      - name: Remove ephemeral production-readiness resources
        if: always()
        working-directory: tooling/infra/aws/metadata-cloud
        run: |
          tofu plan -input=false -lock-timeout=5m -out=cleanup.tfplan \
            -var='deployment_enabled=true' \
            -var='aws_account_id=${{ vars.AWS_ACCOUNT_ID }}' \
            -var='aws_region=${{ vars.AWS_REGION }}' \
            -var='environment=development' \
            -var='budget_alert_email=${{ vars.AWS_BUDGET_ALERT_EMAIL }}' \
            -var='monthly_budget_usd=100' \
            -var='readiness_runner_enabled=false'
          tofu apply -input=false -auto-approve cleanup.tfplan

      - name: Verify zero drift after cleanup
        if: always()
        working-directory: tooling/infra/aws/metadata-cloud
        run: |
          tofu plan -input=false -lock-timeout=5m -detailed-exitcode \
            -var='deployment_enabled=true' \
            -var='aws_account_id=${{ vars.AWS_ACCOUNT_ID }}' \
            -var='aws_region=${{ vars.AWS_REGION }}' \
            -var='environment=development' \
            -var='budget_alert_email=${{ vars.AWS_BUDGET_ALERT_EMAIL }}' \
            -var='monthly_budget_usd=100' \
            -var='readiness_runner_enabled=false'

      - name: Audit the cleaned development foundation
        if: always()
        run: node tooling/infra/audit-aws-development.mjs
